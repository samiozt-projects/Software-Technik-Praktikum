# Application Configuration File
# This file contains configurable settings for the application
# If any values are missing or invalid, default values from the code will be used

# ============================================
# CAMERA SETTINGS
# ============================================

# Model name of the preferred USB camera
camera.model.name=1080P FHD Camera

# Default index for the camera (if no preferred camera is found)
# 0 = Webcam, 1 = Secondary camera, etc.
camera.default.index=0

# Camera resolution settings
camera.width=1920
camera.height=1080

# Frames captured and combined per photo via pixel median to reduce noise.
# 3 = median (recommended), 1 = single frame.
camera.median_frame_count=3

# ============================================
# CAMERA AUTO-CALIBRATION SETTINGS
# ============================================
# Runs once at application startup, started via the Start button on the calibration scene: the
# beamer shows a full white reference area, the camera samples it and sweeps candidate
# exposure/white-balance values to find the best match for the current room lighting. Does NOT
# touch red/blue/green detection ranges (those stay fixed, since streets are physical 3D-printed
# pieces, not projected light - a projected swatch would not represent them well). All ranges below
# are untested placeholders; tune them against the real camera/table setup.

# Master switch. Set to false to skip calibration entirely and use the camera.* values above as-is.
camera.auto_calibration.enabled=true

# Target mean brightness (0-255) of the sampled white reference area.
camera.auto_calibration.target_brightness=170

# Exposure values tried during the sweep (camera/backend specific, e.g. negative on DirectShow).
camera.auto_calibration.exposure_min=-9
camera.auto_calibration.exposure_max=-3
camera.auto_calibration.exposure_step=1

# White-balance color temperatures (Kelvin) tried during the sweep.
camera.auto_calibration.white_balance_min=3000
camera.auto_calibration.white_balance_max=6000
camera.auto_calibration.white_balance_step=500

# Delay (ms) after applying a candidate setting before the next capture, so the driver can apply it.
camera.auto_calibration.settle_delay_ms=300

# Hard ceiling (ms) on the whole calibration sweep. If exceeded, calibration is abandoned and the
# camera keeps whatever settings it already had - a safety net independent of the estimate above.
camera.auto_calibration.max_duration_ms=45000

# Whether the ArUco detection scene (after the white-balance correction) projects the four corner
# markers via the beamer - inverted, i.e. bright on black, since projected "black" is only ambient
# gray - and locks them in for the whole app runtime (PermanentArucoTransform). Set to false to skip
# that scene and A/B test the older behavior instead: physical stickers on the table only,
# re-detected every 15s by ArucoRectificationCache.
camera.auto_calibration.project_aruco_markers=true

# ============================================
# IMAGE PROCESSING SETTINGS
# ============================================

# Fixed table working area inside the raw camera frame
# The frame is cropped to this region (top-left corner x/y, size width x height)
# and then upscaled to the projection surface size before table detection
imageprocessing.pre_crop.x=90
imageprocessing.pre_crop.y=23
imageprocessing.pre_crop.width=1582
imageprocessing.pre_crop.height=1004

# Street detection kernel size for red street detection
# Affects how street lines are detected and connected
imageprocessing.kernel.red.width=60
imageprocessing.kernel.red.height=60

# Polyline approximation parameters
# Controls how street shapes are simplified and validated
imageprocessing.polyline.approx_epsilon=3.0
imageprocessing.polyline.min_arc_length=100.0

# Table detection threshold
# Adjusts sensitivity for detecting the table surface
imageprocessing.table.threshold=180.0

# Node clustering and snapping parameters
# Affects how connection points are grouped and aligned
imageprocessing.node.cluster_radius=75
imageprocessing.node.search_radius=120
imageprocessing.node.snap_radius=25

# How long (in ms) a detected ArUco corner-marker rectification is reused before the next capture
# re-detects the markers, instead of re-detecting on every single capture. Camera and markers do not
# move during normal use, so this can be tuned up once confirmed stable; start low (e.g. 15000-20000)
# and raise it if detection stays reliable, lower it if the camera/table setup moves often.
imageprocessing.aruco.revalidation_interval_ms=15000

# HSV color mask thresholds for street (red) and bridge (blue = level 1, green = level 2) detection.
# OpenCV scale: hue 0-180, saturation/value 0-255. Red wraps around the hue scale and is masked as
# two ranges, [0, hue_low_max] and [hue_high_min, 180], sharing one saturation/value minimum.
#
# Tuned 2026-07-13 against rectified captures of the enlarged projection surface (all three weather
# modes): the bluish beamer light shifts the red lane marking toward MAGENTA - measured dash hue sits
# at 157-172, so hue_high_min must stay well below 157 (the old 160 cut straight through the dashes
# and made whole dash chains flicker in/out between captures). Where the projected street overlay or
# a bright weather background washes the dashes out, their saturation drops to ~30-45 while the hue
# stays magenta - saturation_min 30 recovers those pale dashes; measured false positives on the
# street-free background stay negligible (scattered single pixels) down to that value.
# If street segments still disappear: lower saturation_min further before touching the hue bounds,
# and keep hue_high_min >= ~140 so projected violet/blue UI stays out of the red mask.
imageprocessing.hsv.red.hue_low_max=10
imageprocessing.hsv.red.hue_high_min=146
imageprocessing.hsv.red.saturation_min=30
imageprocessing.hsv.red.value_min=40
imageprocessing.hsv.blue.hue_min=95
imageprocessing.hsv.blue.hue_max=135
imageprocessing.hsv.blue.saturation_min=100
imageprocessing.hsv.blue.value_min=80
imageprocessing.hsv.green.hue_min=35
imageprocessing.hsv.green.hue_max=90
imageprocessing.hsv.green.saturation_min=100
imageprocessing.hsv.green.value_min=80

# ============================================
# SIMULATION SETTINGS
# ============================================

# Simulation speed multiplier
# Higher values make the simulation run faster
simulation.speed=1.0

# Number of vehicles to spawn in simulations
# Affects traffic density and complexity
simulation.vehicles_to_spawn=7

# Challenge mode connection node limit
# Controls difficulty in challenge mode
simulation.challenge.node_limit=4

# ============================================
# NETWORK SETTINGS
# ============================================

# Coupling server base URL for REST requests
network.base_url=https://traficsim.se.uni-kassel.de

# Coupling server host name or IP address
network.host=traficsim.se.uni-kassel.de

# Coupling server port
network.port=443

# Enables table coupling when true
network.active=true

# Team secret sent when creating a world (as deleteToken) and when deleting one
# (as the X-World-Delete-Token header), so only this team can delete the worlds it created.
network.world_delete_token=team-d-c21f7881-a385-49c3-99a6-8564a0575e34
