name: Teamscale Coverage Upload
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-upload:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute tests and generate report
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-0 libxrender1 libxtst6 libxi6
          chmod +x gradlew
          ./gradlew -Djava.awt.headless=true :jvmTest :jacocoTestReport :jacocoCoverageVerification

      - name: Upload coverage to Teamscale
        uses: cqse/teamscale-upload-action@v2.9.5
        with:
          server: 'https://teamscale.se.uni-kassel.de'
          project: 'stp-team-d-sose26'
          user: 'upload_user'
          accesskey: ${{ secrets.TEAMSCALE_ACCESS_KEY }}
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          partition: 'Coverage'
          format: 'JACOCO'
          message: 'Upload coverage from GitHub Actions'
          files: '**/build/reports/jacoco/**/*.xml'

      - name: Upload JVMTests Results to Teamscale
        uses: cqse/teamscale-upload-action@v2.9.5
        with:
          server: 'https://teamscale.se.uni-kassel.de'
          project: 'stp-team-d-sose26'
          user: 'upload_user'
          accesskey: ${{ secrets.TEAMSCALE_ACCESS_KEY }}
          partition: 'Tests'
          format: 'JUNIT'
          message: 'Upload test results from GitHub Actions'
          files: '**/build/test-results/**/*.xml'
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
